[project]
name = "sqlrag-backend"
version = "0.1.0"
description = "Backend for SQLRAG Project Management System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "langchain>=0.2.0",
    "langgraph>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.2.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "openai>=1.0.0",
    "tiktoken",
    "typer",
    "rich",
    "pandas",
    "rapidfuzz",
    "structlog",
    "numpy",
    "ragas",
    "PyJWT>=2.9.0",
    "slowapi",
    "langgraph-checkpoint-sqlite>=2.0.7",
]



[tool.setuptools]
packages = ["app"]
