<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="900px" version="1.1" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F8F9FA" height="100%" width="100%" x="0" y="0" /><text fill="#2C3E50" font-family="Arial, sans-serif" font-size="28px" font-weight="bold" text-anchor="middle" x="600" y="40">ScalableRAG Platform Architecture</text><text fill="#7F8C8D" font-family="Arial, sans-serif" font-size="16px" text-anchor="middle" x="600" y="70">Dual-Engine Retrieval &amp; Async Redis Queues (Plans 04 &amp; 05)</text><text fill="#2C3E50" font-family="Arial, sans-serif" font-size="20px" font-weight="bold" x="50" y="120">1. Asynchronous Ingestion Pipeline</text><rect fill="#000000" height="60" opacity="0.15" rx="8" ry="8" width="160" x="54" y="154" /><rect fill="#FFFFFF" height="60" rx="8" ry="8" stroke="#333333" stroke-width="2" width="160" x="50" y="150" /><text fill="#111111" font-family="Arial, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="130.0" y="170.0">Client / UI</text><text fill="#111111" font-family="Arial, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="130.0" y="190.0">Document Upload</text><rect fill="#000000" height="60" opacity="0.15" rx="8" ry="8" width="160" x="284" y="154" /><rect fill="#D4E6F1" height="60" rx="8" ry="8" stroke="#333333" stroke-width="2" width="160" x="280" y="150" /><text fill="#111111" font-family="Arial, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="360.0" y="170.0">FastAPI Backend</text><text fill="#111111" font-family="Arial, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="360.0" y="190.0">Upload API endpoint</text><rect fill="#000000" height="60" opacity="0.15" rx="8" ry="8" width="160" x="554" y="154" /><rect fill="#D5F5E3" height="60" rx="8" ry="8" stroke="#333333" stroke-width="2" width="160" x="550" y="150" /><text fill="#111111" font-family="Arial, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="630.0" y="170.0">PostgreSQL</text><text fill="#111111" font-family="Arial, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="630.0" y="190.0">Ledger (Source of Truth)</text><rect fill="#000000" height="60" opacity="0.15" rx="8" ry="8" width="160" x="284" y="264" /><rect fill="#FADBD8" height="60" rx="8" ry="8" stroke="#333333" stroke-width="2" width="160" x="280" y="260" /><text fill="#111111" font-family="Arial, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="360.0" y="280.0">Redis (ARQ)</text><text fill="#111111" font-family="Arial, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="360.0" y="300.0">Task Queue</text><rect fill="#000000" height="60" opacity="0.15" rx="8" ry="8" width="160" x="554" y="264" /><rect fill="#FDEBD0" height="60" rx="8" ry="8" stroke="#333333" stroke-width="2" width="160" x="550" y="260" /><text fill="#111111" font-family="Arial, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="630.0" y="280.0">Worker 1</text><text fill="#111111" font-family="Arial, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="630.0" y="300.0">@task: process_document</text><rect fill="#000000" height="60" opacity="0.15" rx="8" ry="8" width="160" x="824" y="264" /><rect fill="#E8DAEF" height="60" rx="8" ry="8" stroke="#333333" stroke-width="2" width="160" x="820" y="260" /><text fill="#111111" font-family="Arial, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="900.0" y="270.0">Azure Document</text><text fill="#111111" font-family="Arial, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="900.0" y="290.0">Intelligence</text><text fill="#111111" font-family="Arial, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="900.0" y="310.0">(Parsing)</text><rect fill="#000000" height="60" opacity="0.15" rx="8" ry="8" width="160" x="554" y="364" /><rect fill="#FDEBD0" height="60" rx="8" ry="8" stroke="#333333" stroke-width="2" width="160" x="550" y="360" /><text fill="#111111" font-family="Arial, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="630.0" y="380.0">Worker 2</text><text fill="#111111" font-family="Arial, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="630.0" y="400.0">@task: embed_chunks</text><rect fill="#000000" height="60" opacity="0.15" rx="8" ry="8" width="160" x="824" y="364" /><rect fill="#E8DAEF" height="60" rx="8" ry="8" stroke="#333333" stroke-width="2" width="160" x="820" y="360" /><text fill="#111111" font-family="Arial, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="900.0" y="380.0">Azure OpenAI</text><text fill="#111111" font-family="Arial, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="900.0" y="400.0">Embedding Model</text><rect fill="#000000" height="60" opacity="0.15" rx="8" ry="8" width="160" x="554" y="464" /><rect fill="#FDEBD0" height="60" rx="8" ry="8" stroke="#333333" stroke-width="2" width="160" x="550" y="460" /><text fill="#111111" font-family="Arial, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="630.0" y="480.0">Worker 3</text><text fill="#111111" font-family="Arial, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="630.0" y="500.0">@task: sync_to_search</text><path d="M 210 180 L 280 180" fill="none" stroke="#555555" stroke-width="2" /><polygon fill="#555555" points="0,0 -10,-5 -10,5" transform="translate(280,180) rotate(0.0)" /><rect fill="white" height="16" opacity="0.8" width="64" x="213.0" y="158.0" /><text fill="#333333" font-family="Arial, sans-serif" font-size="12px" font-style="italic" text-anchor="middle" x="245.0" y="170.0">HTTP POST</text><path d="M 440 180 L 550 180" fill="none" stroke="#555555" stroke-width="2" /><polygon fill="#555555" points="0,0 -10,-5 -10,5" transform="translate(550,180) rotate(0.0)" /><rect fill="white" height="16" opacity="0.8" width="100" x="445.0" y="158.0" /><text fill="#333333" font-family="Arial, sans-serif" font-size="12px" font-style="italic" text-anchor="middle" x="495.0" y="170.0">1. Write Record</text><path d="M 360 210 L 360 260" fill="none" stroke="#555555" stroke-width="2" /><polygon fill="#555555" points="0,0 -10,-5 -10,5" transform="translate(360,260) rotate(90)" /><rect fill="white" height="16" opacity="0.8" width="100" x="310.0" y="213.0" /><text fill="#333333" font-family="Arial, sans-serif" font-size="12px" font-style="italic" text-anchor="middle" x="360.0" y="225.0">2. Enqueue Task</text><path d="M 440 290 L 550 290" fill="none" stroke="#555555" stroke-width="2" /><polygon fill="#555555" points="0,0 -10,-5 -10,5" transform="translate(550,290) rotate(0.0)" /><rect fill="white" height="16" opacity="0.8" width="70" x="460.0" y="268.0" /><text fill="#333333" font-family="Arial, sans-serif" font-size="12px" font-style="italic" text-anchor="middle" x="495.0" y="280.0">3. Trigger</text><path d="M 710 290 L 820 290" fill="none" stroke="#555555" stroke-width="2" /><polygon fill="#555555" points="0,0 -10,-5 -10,5" transform="translate(820,290) rotate(0.0)" /><rect fill="white" height="16" opacity="0.8" width="82" x="724.0" y="268.0" /><text fill="#333333" font-family="Arial, sans-serif" font-size="12px" font-style="italic" text-anchor="middle" x="765.0" y="280.0">4. Parse PDF</text><path d="M 630 320 L 630 360" fill="none" stroke="#555555" stroke-width="2" /><polygon fill="#555555" points="0,0 -10,-5 -10,5" transform="translate(630,360) rotate(90)" /><rect fill="white" height="16" opacity="0.8" width="70" x="595.0" y="318.0" /><text fill="#333333" font-family="Arial, sans-serif" font-size="12px" font-style="italic" text-anchor="middle" x="630.0" y="330.0">5. Enqueue</text><path d="M 710 390 L 820 390" fill="none" stroke="#555555" stroke-width="2" /><polygon fill="#555555" points="0,0 -10,-5 -10,5" transform="translate(820,390) rotate(0.0)" /><rect fill="white" height="16" opacity="0.8" width="142" x="694.0" y="368.0" /><text fill="#333333" font-family="Arial, sans-serif" font-size="12px" font-style="italic" text-anchor="middle" x="765.0" y="380.0">6. Generate Embeddings</text><path d="M 630 420 L 630 460" fill="none" stroke="#555555" stroke-width="2" /><polygon fill="#555555" points="0,0 -10,-5 -10,5" transform="translate(630,460) rotate(90)" /><rect fill="white" height="16" opacity="0.8" width="100" x="580.0" y="418.0" /><text fill="#333333" font-family="Arial, sans-serif" font-size="12px" font-style="italic" text-anchor="middle" x="630.0" y="430.0">7. Enqueue Sync</text><path d="M 630 260 L 630 210" fill="none" stroke="#555555" stroke-width="2" /><polygon fill="#555555" points="0,0 -10,-5 -10,5" transform="translate(630,210) rotate(-90)" /><rect fill="white" height="16" opacity="0.8" width="82" x="634.0" y="223.0" /><text fill="#333333" font-family="Arial, sans-serif" font-size="12px" font-style="italic" text-anchor="middle" x="675.0" y="235.0">Update State</text><text fill="#2C3E50" font-family="Arial, sans-serif" font-size="20px" font-weight="bold" x="50" y="560">2. Dual-Engine Retrieval Plane</text><rect fill="#000000" height="60" opacity="0.15" rx="8" ry="8" width="160" x="54" y="604" /><rect fill="#FFFFFF" height="60" rx="8" ry="8" stroke="#333333" stroke-width="2" width="160" x="50" y="600" /><text fill="#111111" font-family="Arial, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="130.0" y="620.0">Client / UI</text><text fill="#111111" font-family="Arial, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="130.0" y="640.0">Search Query</text><rect fill="#000000" height="60" opacity="0.15" rx="8" ry="8" width="160" x="284" y="604" /><rect fill="#D4E6F1" height="60" rx="8" ry="8" stroke="#333333" stroke-width="2" width="160" x="280" y="600" /><text fill="#111111" font-family="Arial, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="360.0" y="610.0">FastAPI Backend</text><text fill="#111111" font-family="Arial, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="360.0" y="630.0">Query API endpoint</text><text fill="#111111" font-family="Arial, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="360.0" y="650.0">App-Side RRF</text><rect fill="#000000" height="60" opacity="0.15" rx="8" ry="8" width="160" x="554" y="554" /><rect fill="#D1F2EB" height="60" rx="8" ry="8" stroke="#333333" stroke-width="2" width="160" x="550" y="550" /><text fill="#111111" font-family="Arial, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="630.0" y="560.0">OpenSearch</text><text fill="#111111" font-family="Arial, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="630.0" y="580.0">BM25 Lexical Search</text><text fill="#111111" font-family="Arial, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="630.0" y="600.0">(Tenant ACL Filter)</text><rect fill="#000000" height="60" opacity="0.15" rx="8" ry="8" width="160" x="554" y="654" /><rect fill="#D1F2EB" height="60" rx="8" ry="8" stroke="#333333" stroke-width="2" width="160" x="550" y="650" /><text fill="#111111" font-family="Arial, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="630.0" y="660.0">Qdrant</text><text fill="#111111" font-family="Arial, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="630.0" y="680.0">Vector Search</text><text fill="#111111" font-family="Arial, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="630.0" y="700.0">(Tenant ACL Filter)</text><rect fill="#000000" height="60" opacity="0.15" rx="8" ry="8" width="160" x="824" y="604" /><rect fill="#E8DAEF" height="60" rx="8" ry="8" stroke="#333333" stroke-width="2" width="160" x="820" y="600" /><text fill="#111111" font-family="Arial, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="900.0" y="620.0">Cohere Rerank</text><text fill="#111111" font-family="Arial, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="900.0" y="640.0">Cross-Attention API</text><path d="M 710 490 L 780 490" fill="none" stroke="#555555" stroke-width="2" /><polygon fill="#555555" points="0,0 -10,-5 -10,5" transform="translate(780,490) rotate(0.0)" /><path d="M 780 490 L 780 580" fill="none" stroke="#555555" stroke-width="2" /><polygon fill="#555555" points="0,0 -10,-5 -10,5" transform="translate(780,580) rotate(90)" /><path d="M 780 580 L 710 580" fill="none" stroke="#555555" stroke-width="2" /><polygon fill="#555555" points="0,0 -10,-5 -10,5" transform="translate(710,580) rotate(180.0)" /><rect fill="white" height="16" opacity="0.8" width="94" x="698.0" y="558.0" /><text fill="#333333" font-family="Arial, sans-serif" font-size="12px" font-style="italic" text-anchor="middle" x="745.0" y="570.0">8. Upsert Text</text><path d="M 780 580 L 780 680" fill="none" stroke="#555555" stroke-width="2" /><polygon fill="#555555" points="0,0 -10,-5 -10,5" transform="translate(780,680) rotate(90)" /><path d="M 780 680 L 710 680" fill="none" stroke="#555555" stroke-width="2" /><polygon fill="#555555" points="0,0 -10,-5 -10,5" transform="translate(710,680) rotate(180.0)" /><rect fill="white" height="16" opacity="0.8" width="112" x="689.0" y="658.0" /><text fill="#333333" font-family="Arial, sans-serif" font-size="12px" font-style="italic" text-anchor="middle" x="745.0" y="670.0">8. Upsert Vectors</text><path d="M 210 630 L 280 630" fill="none" stroke="#555555" stroke-width="2" /><polygon fill="#555555" points="0,0 -10,-5 -10,5" transform="translate(280,630) rotate(0.0)" /><rect fill="white" height="16" opacity="0.8" width="70" x="210.0" y="608.0" /><text fill="#333333" font-family="Arial, sans-serif" font-size="12px" font-style="italic" text-anchor="middle" x="245.0" y="620.0">Search Req</text><path d="M 440 610 L 550 580" fill="none" stroke="#555555" stroke-width="2" /><polygon fill="#555555" points="0,0 -10,-5 -10,5" transform="translate(550,580) rotate(-15.255118703057777)" /><rect fill="white" height="16" opacity="0.8" width="94" x="448.0" y="573.0" /><text fill="#333333" font-family="Arial, sans-serif" font-size="12px" font-style="italic" text-anchor="middle" x="495.0" y="585.0">9. Async Query</text><path d="M 440 650 L 550 680" fill="none" stroke="#555555" stroke-width="2" /><polygon fill="#555555" points="0,0 -10,-5 -10,5" transform="translate(550,680) rotate(15.255118703057777)" /><rect fill="white" height="16" opacity="0.8" width="94" x="448.0" y="643.0" /><text fill="#333333" font-family="Arial, sans-serif" font-size="12px" font-style="italic" text-anchor="middle" x="495.0" y="655.0">9. Async Query</text><path d="M 550 600 L 440 620" fill="none" stroke="#555555" stroke-width="2" /><polygon fill="#555555" points="0,0 -10,-5 -10,5" transform="translate(440,620) rotate(169.69515353123398)" /><rect fill="white" height="16" opacity="0.8" width="64" x="463.0" y="588.0" /><text fill="#333333" font-family="Arial, sans-serif" font-size="12px" font-style="italic" text-anchor="middle" x="495.0" y="600.0">10. Top N</text><path d="M 550 660 L 440 640" fill="none" stroke="#555555" stroke-width="2" /><polygon fill="#555555" points="0,0 -10,-5 -10,5" transform="translate(440,640) rotate(-169.69515353123398)" /><rect fill="white" height="16" opacity="0.8" width="64" x="463.0" y="628.0" /><text fill="#333333" font-family="Arial, sans-serif" font-size="12px" font-style="italic" text-anchor="middle" x="495.0" y="640.0">10. Top N</text><path d="M 440 630 L 820 630" fill="none" stroke="#555555" stroke-width="2" /><polygon fill="#555555" points="0,0 -10,-5 -10,5" transform="translate(820,630) rotate(0.0)" /><rect fill="white" height="16" opacity="0.8" width="160" x="550.0" y="603.0" /><text fill="#333333" font-family="Arial, sans-serif" font-size="12px" font-style="italic" text-anchor="middle" x="630.0" y="615.0">11. Merged RRF Candidates</text><path d="M 820 650 L 440 670" fill="none" stroke="#555555" stroke-width="2" /><polygon fill="#555555" points="0,0 -10,-5 -10,5" transform="translate(440,670) rotate(176.98721249581666)" /><rect fill="white" height="16" opacity="0.8" width="160" x="550.0" y="663.0" /><text fill="#333333" font-family="Arial, sans-serif" font-size="12px" font-style="italic" text-anchor="middle" x="630.0" y="675.0">12. Final Ordered Results</text><rect fill="#EAECEE" height="110" rx="5" ry="5" stroke="#ABB2B9" width="1100" x="50" y="760" /><text fill="#2C3E50" font-family="monospace" font-size="13px" x="70" y="785">Architecture Highlights:</text><text fill="#2C3E50" font-family="monospace" font-size="13px" x="70" y="805">• Outbox Pattern: Postgres is the source of truth; Redis async queues handle heavy jobs without blocking.</text><text fill="#2C3E50" font-family="monospace" font-size="13px" x="70" y="825">• Idempotent Sync: Chunks are synced to both OpenSearch and Qdrant reliably.</text><text fill="#2C3E50" font-family="monospace" font-size="13px" x="70" y="845">• Security: Strict 'tenant_id' ACL filters applied at the database engine level.</text><text fill="#2C3E50" font-family="monospace" font-size="13px" x="70" y="865">• Accuracy: OpenSearch (Lexical) + Qdrant (Semantic) fused via RRF, then reranked by Cohere.</text></svg>