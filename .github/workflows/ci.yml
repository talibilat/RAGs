  # Test SQLRAG
  test-sqlrag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./SQLRAG
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SQLRAG Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Test SQLRAG
        run: |
          python -c "import sys; print('Python version:', sys.version)"
          python -c "import src.agent; print('SQLRAG imports successfully')"

