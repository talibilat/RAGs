  # Lint and Format Check
  lint-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 black isort
      - name: Lint Python Files
        run: |
          find . -name "*.py" -not -path "./venv/*" -not -path "./*/venv/*" -not -path "./*/myenv/*" -not -path "./*/node_modules/*" | xargs flake8 --max-line-length=100 --ignore=E203,W503
      - name: Check Code Formatting
        run: |
          find . -name "*.py" -not -path "./venv/*" -not -path "./*/venv/*" -not -path "./*/myenv/*" -not -path "./*/node_modules/*" | xargs black --check --line-length=100
